  <body>
    <!-- GitHub Pages SPA redirect: restore path from 404.html query param -->
    <script>
      (function() {
        var p = window.location.search.slice(1);
        if (p.indexOf('p=/') === 0) {
          var parts = p.split('&');
          var path = parts[0].slice(2).replace(/~and~/g, '&');
          var query = parts[1] ? '?' + parts[1].slice(2).replace(/~and~/g, '&') : '';
          var hash = window.location.hash;
          window.history.replaceState(null, null, window.location.pathname + path + query + hash);
        }
      })();
    </script>
